# -- PR gated

[repos."avencera/codemode-mcp"]
steps = ["commit", "push", "pr", "merge", "deploy", "clean"]
deploy = [
  "just bump <part>",
  "just release github",
  "homebased --json task run --name \"Release run\" --timeout 2h -- ~/.agents/skills/ship/scripts/watch_run.sh Release HEAD",
  "cmd fleet update",
]
notes = "`just bump` commits \"Release vX.Y.Z\" and pushes it itself; `just release github` refuses to run until that commit is on origin"

[repos."avencera/speakrs"]
steps = ["sol", "commit", "push", "pr", "greptile", "merge", "clean"]
greptile = true
publish = ["just publish --dry-run", "just publish"]

[repos."avencera/rustywind"]
steps = ["sol", "commit", "push", "pr", "greptile", "merge", "clean"]
greptile = true
notes = "CodeRabbit also reviews PRs here; address its comments in the greptile step too. Releases follow RELEASE.md by hand, so there is no publish step"

[repos."bitcoinppl/cove"]
