# -- PR gated

[repos."avencera/codemode-mcp"]
steps = ["commit", "push", "pr", "greptile", "merge", "deploy", "clean"]
greptile = true
deploy = [
  "just bump <part>",
  "just release github",
  "homebased --json task run --name \"Release run\" --timeout 2h -- cmd ship watch-run Release HEAD",
  "cmd fleet update",
]
notes = "`just bump` commits \"Release vX.Y.Z\" and pushes it itself; `just release github` refuses to run until that commit is on origin"

