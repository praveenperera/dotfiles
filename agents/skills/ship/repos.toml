notes = "<next> is one more than the freezerwatch image tag in ~/code/homelab/stacks/lookout/docker-compose.yml. The pathspec commit leaves other staged homelab work alone, but it takes each listed file whole: when another task has edits in one of them, commit only this deploy's hunks instead. The push runs only when this commit is the sole unpushed one"

