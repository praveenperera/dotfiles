deploy = ["just deploy"]

[repos."praveenperera/apologetics"]
steps = ["commit", "push", "deploy", "clean"]
deploy = ["cd <site> && just deploy"]
notes = "Run once for each site directory the change touched: bereadytoanswer, mormonsarenotchristians, notwhatyouheard, propheciesofjesus"

[repos."praveenperera/dotfiles"]
steps = ["commit", "push", "deploy", "clean"]
deploy = [
  "cmd release",
  "homebased --json task run --name \"release-cmd run\" --timeout 2h -- ~/.agents/skills/ship/scripts/watch_run.sh release-cmd HEAD",
  "git pull --ff-only",
  "cmd fleet update",
]
deploy_paths = ["cmd/"]
deploy_otherwise = ["cmd fleet dfu"]
notes = "Pushing cmd/** to master triggers release-cmd.yml, which bumps the version and commits it, hence the pull before the fleet update"

# -- tools released through GitHub Actions

[repos."avencera/homebased"]
steps = ["commit", "push", "deploy", "clean"]
deploy = [
  "just bump <part>",
  "git add Cargo.toml Cargo.lock && git commit -m 'Bump version to v<version>'",
  "git push origin master",
  "just release github",
  "homebased --json task run --name \"Release run\" --timeout 2h -- ~/.agents/skills/ship/scripts/watch_run.sh Release HEAD",
  "cmd fleet update",
]
notes = "`just bump` only edits the version files and `just release github` only tags, so the bump commit and push in between are required"

