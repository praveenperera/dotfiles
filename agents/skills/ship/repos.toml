# Per-repo defaults for /ship, keyed by the origin remote's GitHub owner/repo
#
# Keeping this here instead of in each repo leaves work and upstream repos untouched
#
# Fields per repo:
#   steps     default sequence; `cmd ship plan` sorts it into the canonical order. Leave
#             "settle" out: it is opt-in per run with `/ship +settle`
#   deploy    commands for the deploy step; <part> is the bump level (patch unless overridden)
#   deploy_paths, deploy_otherwise
#             run deploy_otherwise instead of deploy when the work touches none of deploy_paths
#   publish   commands for the opt-in publish step, kept separate because a published
#             version cannot be taken back
#   greptile  true when the Greptile app reviews this repo's PRs
#   merge     "squash" (default) or "never" when someone else merges
#   pr_repo   PR target when it differs from origin, such as an upstream for a fork
#   pr_draft  open PRs as drafts
#   notes     instructions the commands alone don't capture

# Orgs Praveen owns; a PR target outside these always gets a Sol review
owners = ["praveenperera", "avencera", "bitcoinppl"]

# Any owned repo without an entry
[default]
steps = ["commit", "push", "clean"]

# Any repo whose PR target is outside `owners`, listed or not
[external]
steps = ["sol", "commit", "push", "pr", "clean"]

# -- direct to master, then deploy

[repos."avencera/avencera"]
steps = ["commit", "push", "deploy", "clean"]
greptile = true
deploy = [
  "pnpm --dir web run build",
  "pnpm --dir web exec node scripts/public-leak-scan.mjs .svelte-kit/cloudflare",
  "pnpm --dir web exec wrangler deploy",
]
notes = "Deploy publishes the web Worker to preview.avencera.com only; production (`wrangler deploy --env production`, avencera.com) is a separate, explicit request. Verify the changed pages on https://preview.avencera.com. Skip deploy when the work touches nothing under web/"


[repos."praveenperera/homelab"]
steps = ["commit", "push", "deploy", "clean"]
deploy = ["just deploy <item>"]
notes = "Run `just deploy <item>` once per stack or item the change touched; see the deploy recipe comment for item names. Never run it without an item, since that opens an fzf picker"

[repos."praveenperera/lookout-hub"]
steps = ["commit", "push", "deploy", "clean"]
deploy = [
  "just deploy v<next>",
  "git -C ~/code/homelab commit -m 'Deploy lookout-hub v<next>' -- stacks/lookout/docker-compose.yml",
  "test \"$(git -C ~/code/homelab rev-list --count @{u}..HEAD)\" = 1 && git -C ~/code/homelab push",
]
notes = "<next> is one more than the lookout-hub image tag in ~/code/homelab/stacks/lookout/docker-compose.yml. The pathspec commit leaves other staged homelab work alone, but it takes each listed file whole: when another task has edits in one of them, commit only this deploy's hunks instead. The push runs only when this commit is the sole unpushed one"

